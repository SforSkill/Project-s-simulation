name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: SforSkill/Project-s-docs/.github/workflows/rust.yml@v0.1.0
    with:
      tools-ref: v0.1.0
      content: true
